name: Sincronizar vídeos del Cuaderno de Séneca
on:
  workflow_dispatch:
  schedule:
    - cron: '38 5 * * 1'
  push:
    branches: [main, master]
    paths:
      - 'scripts/sincronizar_cuaderno_seneca.py'
      - '.github/workflows/sincronizar-cuaderno-seneca.yml'
      - 'assets/seneca-videos.json'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de metadatos
        run: python -m pip install --upgrade yt-dlp deep-translator
      - name: Consultar lista pública de YouTube
        run: python scripts/sincronizar_cuaderno_seneca.py
      - name: Guardar cambios si se han obtenido datos nuevos
        run: |
          if ! git diff --quiet -- assets/seneca-videos.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/seneca-videos.json
            git commit -m 'Actualizar videotutoriales del Cuaderno de Séneca [skip ci]'
            git push
          else
            echo 'Sin datos nuevos que publicar.'
          fi
