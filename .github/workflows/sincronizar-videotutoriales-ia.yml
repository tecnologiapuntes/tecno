name: Sincronizar videotutoriales de Inteligencia Artificial
on:
  workflow_dispatch:
  schedule:
    - cron: '46 5 * * 1'
  push:
    branches: [main, master]
    paths:
      - 'scripts/sincronizar_videotutoriales_ia.py'
      - '.github/workflows/sincronizar-videotutoriales-ia.yml'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de metadatos
        run: python -m pip install --upgrade yt-dlp
      - name: Recuperar vídeos de la lista original
        run: python scripts/sincronizar_videotutoriales_ia.py
      - name: Publicar el listado cuando cambie
        run: |
          if [ -f assets/ia-videos.json ]; then
            git add assets/ia-videos.json
            if ! git diff --cached --quiet -- assets/ia-videos.json; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Sincronizar videotutoriales de IA [skip ci]'
              git pull --rebase origin "${{ github.ref_name }}"
              git push origin "${{ github.ref_name }}"
            else
              echo 'No hay nuevos metadatos.'
            fi
          else
            echo 'YouTube no devolvió datos nuevos; se conservan los datos anteriores.'
          fi
